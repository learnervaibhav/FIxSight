[project]
name = "fixsight"
version = "0.2.0"
description = "Agentic predictive vehicle maintenance: telemetry -> XGBoost -> Gemini -> service booking -> SMS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.1",
    "joblib>=1.5.3",
    "langchain-core>=1.3.3",
    "langchain-google-genai>=4.2.2",
    "langgraph>=1.1.10",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0.49",
    "twilio>=9.12.0",
    # CPU-only wheel on Linux (Docker) avoids ~600 MB of CUDA libraries; same `xgboost` module.
    "xgboost>=3.2.0; sys_platform != 'linux'",
    "xgboost-cpu>=3.2.0,<3.3; sys_platform == 'linux'",  # same minor as Windows: RUL model is a pickle
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
